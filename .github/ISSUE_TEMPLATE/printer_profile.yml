name: Printer profile
description: Numbers measured on a printer other than the X1E
labels: [printer profile]
body:
  - type: input
    id: printer
    attributes:
      label: Printer
      description: Make and model
    validations:
      required: true
  - type: input
    id: holder
    attributes:
      label: Pen holder
    validations:
      required: true
  - type: textarea
    id: numbers
    attributes:
      label: Measurements
      description: Bed size, and where the nozzle can safely go with the holder on (left, right, front and back limits), in mm
      placeholder: |
        Bed: 256 x 256
        Nozzle X: 34.5 to 256
        Nozzle Y: 67 to 256
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: How the plot went
      description: Did the pen-up run, outline and real plot all go as expected?
